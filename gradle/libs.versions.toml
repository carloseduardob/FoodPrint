navigationCompose = "2.9.8"
foundation = "1.11.1"
uiUnit = "1.11.2"
lifecycleViewmodelKtx = "2.10.0"
ksp = "2.2.10-2.0.2"
retrofit = "2.11.0"
coil = "2.7.0"
